<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <rect width="500" height="350" rx="16" fill="#f8fafc"/>
  <rect x="20" y="20" width="460" height="310" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <g transform="translate(110, 80)">
    <!-- Nano Board PCB -->
    <rect x="0" y="0" width="280" height="190" rx="8" fill="#1d4ed8" stroke="#1e40af" stroke-width="2"/>
    
    <!-- Mini USB Connector -->
    <rect x="-15" y="70" width="40" height="50" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
    <rect x="-10" y="80" width="20" height="30" fill="#475569"/>

    <!-- TQFP ATmega328P Chip -->
    <rect x="115" y="70" width="50" height="50" fill="#1e293b" rx="3" transform="rotate(45 140 95)"/>
    <circle cx="130" cy="85" r="3" fill="#64748b"/>

    <!-- Top Pin Header Row -->
    <g fill="#f59e0b">
      <rect x="20" y="8" width="240" height="12" rx="2" fill="#0f172a"/>
      <circle cx="35" cy="14" r="3"/><circle cx="52" cy="14" r="3"/><circle cx="69" cy="14" r="3"/>
      <circle cx="86" cy="14" r="3"/><circle cx="103" cy="14" r="3"/><circle cx="120" cy="14" r="3"/>
      <circle cx="137" cy="14" r="3"/><circle cx="154" cy="14" r="3"/><circle cx="171" cy="14" r="3"/>
      <circle cx="188" cy="14" r="3"/><circle cx="205" cy="14" r="3"/><circle cx="222" cy="14" r="3"/>
      <circle cx="239" cy="14" r="3"/>
    </g>

    <!-- Bottom Pin Header Row -->
    <g fill="#f59e0b">
      <rect x="20" y="170" width="240" height="12" rx="2" fill="#0f172a"/>
      <circle cx="35" cy="176" r="3"/><circle cx="52" cy="176" r="3"/><circle cx="69" cy="176" r="3"/>
      <circle cx="86" cy="176" r="3"/><circle cx="103" cy="176" r="3"/><circle cx="120" cy="176" r="3"/>
      <circle cx="137" cy="176" r="3"/><circle cx="154" cy="176" r="3"/><circle cx="171" cy="176" r="3"/>
      <circle cx="188" cy="176" r="3"/><circle cx="205" cy="176" r="3"/><circle cx="222" cy="176" r="3"/>
      <circle cx="239" cy="176" r="3"/>
    </g>

    <!-- Reset Button -->
    <rect x="210" y="85" width="20" height="20" fill="#cbd5e1" rx="2"/>
    <circle cx="220" cy="95" r="5" fill="#ef4444"/>

    <text x="55" y="100" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">NANO</text>
  </g>
</svg>
