<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="metalBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" rx="16" fill="#f8fafc"/>
  <rect x="20" y="20" width="460" height="310" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <g transform="translate(60, 110)">
    <!-- Yellow Gearbox Housing Right -->
    <rect x="220" y="10" width="130" height="110" rx="12" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>
    <circle cx="285" cy="65" r="22" fill="#ca8a04"/>

    <!-- Steel D-Shaft Extending out from Gearbox -->
    <rect x="350" y="55" width="60" height="20" rx="2" fill="#cbd5e1" stroke="#64748b"/>
    <!-- D-cut flat line -->
    <line x1="370" y1="55" x2="410" y2="55" stroke="#475569" stroke-width="4"/>

    <!-- Cylindrical DC Motor Can Left -->
    <rect x="30" y="25" width="190" height="80" rx="40" fill="url(#metalBody)" stroke="#334155" stroke-width="2"/>
    
    <!-- Solder Power Contacts (Rear) -->
    <rect x="15" y="45" width="15" height="12" rx="2" fill="#d97706"/>
    <rect x="15" y="73" width="15" height="12" rx="2" fill="#d97706"/>

    <text x="125" y="72" font-family="sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">12V DC MOTOR</text>
  </g>
</svg>
