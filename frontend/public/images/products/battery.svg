<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <rect width="500" height="350" rx="16" fill="#f8fafc"/>
  <rect x="20" y="20" width="460" height="310" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <g transform="translate(100, 60)">
    <!-- Blue Shrink-Wrap Battery Pack Block -->
    <rect x="0" y="0" width="280" height="170" rx="14" fill="#1d4ed8" stroke="#1e40af" stroke-width="3"/>

    <!-- 3 Internal Li-ion Cell Outlines -->
    <rect x="20" y="25" width="70" height="120" rx="8" fill="#2563eb" stroke="#60a5fa" stroke-width="1.5"/>
    <rect x="105" y="25" width="70" height="120" rx="8" fill="#2563eb" stroke="#60a5fa" stroke-width="1.5"/>
    <rect x="190" y="25" width="70" height="120" rx="8" fill="#2563eb" stroke="#60a5fa" stroke-width="1.5"/>

    <!-- Battery Bolt Icon -->
    <path d="M 145 55 L 125 90 H 145 L 135 115 L 160 80 H 140 Z" fill="#facc15"/>

    <!-- DC Jack Lead Wire extending right -->
    <path d="M 280 85 C 320 85, 340 120, 360 120" fill="none" stroke="#0f172a" stroke-width="6"/>
    <rect x="360" y="110" width="30" height="20" rx="4" fill="#1e293b"/>
    <rect x="390" y="116" width="15" height="8" rx="1" fill="#cbd5e1"/>

    <text x="140" y="160" font-family="monospace" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">12V 3000mAh</text>
  </g>
</svg>
