<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <rect width="500" height="350" rx="16" fill="#f8fafc"/>
  <rect x="20" y="20" width="460" height="310" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <g transform="translate(100, 45)">
    <!-- Red PCB Board -->
    <rect x="0" y="0" width="300" height="250" rx="10" fill="#dc2626" stroke="#b91c1c" stroke-width="2"/>

    <!-- Large Black Aluminum Heatsink Block in Center -->
    <rect x="80" y="30" width="140" height="110" rx="4" fill="#0f172a"/>
    <!-- Heatsink Fins (Vertical lines) -->
    <g fill="#334155">
      <rect x="95" y="35" width="8" height="100" rx="2"/>
      <rect x="115" y="35" width="8" height="100" rx="2"/>
      <rect x="135" y="35" width="8" height="100" rx="2"/>
      <rect x="155" y="35" width="8" height="100" rx="2"/>
      <rect x="175" y="35" width="8" height="100" rx="2"/>
      <rect x="195" y="35" width="8" height="100" rx="2"/>
    </g>

    <!-- Blue Screw Terminal Blocks (Motor Output Left & Right) -->
    <g fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5">
      <rect x="10" y="70" width="40" height="70" rx="3"/>
      <circle cx="30" cy="90" r="6" fill="#cbd5e1"/>
      <circle cx="30" cy="120" r="6" fill="#cbd5e1"/>

      <rect x="250" y="70" width="40" height="70" rx="3"/>
      <circle cx="270" cy="90" r="6" fill="#cbd5e1"/>
      <circle cx="270" cy="120" r="6" fill="#cbd5e1"/>

      <!-- Power In Terminal Bottom -->
      <rect x="110" y="195" width="80" height="45" rx="3"/>
      <circle cx="130" cy="217" r="6" fill="#cbd5e1"/>
      <circle cx="150" cy="217" r="6" fill="#cbd5e1"/>
      <circle cx="170" cy="217" r="6" fill="#cbd5e1"/>
    </g>

    <!-- Filter Capacitors (Cylindrical black/silver) -->
    <circle cx="60" cy="180" r="16" fill="#1e293b" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="240" cy="180" r="16" fill="#1e293b" stroke="#cbd5e1" stroke-width="3"/>

    <text x="150" y="165" font-family="monospace" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">L298N DUAL H-BRIDGE</text>
  </g>
</svg>
