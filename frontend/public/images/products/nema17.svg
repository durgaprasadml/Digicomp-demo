<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <rect width="500" height="350" rx="16" fill="#f8fafc"/>
  <rect x="20" y="20" width="460" height="310" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <g transform="translate(130, 45)">
    <!-- Square Black Stepper Motor Body -->
    <rect x="0" y="0" width="240" height="240" rx="16" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
    
    <!-- 4 Corner Metal Caps/Bevels -->
    <rect x="0" y="0" width="30" height="30" fill="#475569"/>
    <rect x="210" y="0" width="30" height="30" fill="#475569"/>
    <rect x="0" y="210" width="30" height="30" fill="#475569"/>
    <rect x="210" y="210" width="30" height="30" fill="#475569"/>

    <!-- 4 Screw Mounting Holes -->
    <circle cx="20" cy="20" r="8" fill="#0f172a"/>
    <circle cx="220" cy="20" r="8" fill="#0f172a"/>
    <circle cx="20" cy="220" r="8" fill="#0f172a"/>
    <circle cx="220" cy="220" r="8" fill="#0f172a"/>

    <!-- Raised Center Circular Bearing Hub -->
    <circle cx="120" cy="120" r="65" fill="#64748b" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="120" cy="120" r="45" fill="#cbd5e1"/>

    <!-- Center Steel Rotor Shaft -->
    <circle cx="120" cy="120" r="22" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <line x1="102" y1="120" x2="138" y2="120" stroke="#475569" stroke-width="3"/>

    <text x="120" y="200" font-family="monospace" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">NEMA 17</text>
  </g>
</svg>
