<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <rect width="500" height="350" rx="16" fill="#f8fafc"/>
  <rect x="20" y="20" width="460" height="310" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <g transform="translate(100, 60)">
    <!-- Module PCB -->
    <rect x="0" y="0" width="300" height="150" rx="8" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>

    <!-- LDR Photoresistor Element -->
    <g transform="translate(45, 75)">
      <circle cx="0" cy="0" r="28" fill="#fef08a" stroke="#ca8a04" stroke-width="3"/>
      <!-- S-Track CdS Sensor Trace -->
      <path d="M -18 -12 C -8 -25, 8 -25, 18 -12 C 8 0, -8 0, -18 12 C -8 25, 8 25, 18 12" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- LM393 Comparator IC -->
    <rect x="120" y="55" width="55" height="40" fill="#1e293b" rx="2"/>
    <text x="147" y="79" font-family="sans-serif" font-size="9" fill="#e2e8f0" text-anchor="middle">LM393</text>

    <!-- Blue Trimmer Potentiometer -->
    <rect x="200" y="45" width="50" height="60" fill="#0284c7" rx="4"/>
    <circle cx="225" cy="75" r="16" fill="#f59e0b"/>
    <!-- Cross Screw Slot -->
    <line x1="215" y1="75" x2="235" y2="75" stroke="#78350f" stroke-width="3"/>
    <line x1="225" y1="65" x2="225" y2="85" stroke="#78350f" stroke-width="3"/>

    <!-- 4 Header Pins Right Side -->
    <g transform="translate(300, 40)" fill="#f59e0b">
      <rect x="0" y="0" width="25" height="70" fill="#0f172a"/>
      <circle cx="12" cy="15" r="4"/><circle cx="12" cy="30" r="4"/>
      <circle cx="12" cy="45" r="4"/><circle cx="12" cy="60" r="4"/>
    </g>

    <!-- Sun rays graphics icon -->
    <path d="M 45 25 L 45 15 M 45 125 L 45 135 M 0 75 L -10 75 M 90 75 L 100 75" stroke="#eab308" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
