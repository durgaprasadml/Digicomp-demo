<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <rect width="500" height="350" rx="16" fill="#f8fafc"/>
  <rect x="20" y="20" width="460" height="310" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <g transform="translate(100, 50)">
    <!-- Blue PCB Base -->
    <rect x="0" y="0" width="300" height="230" rx="10" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>

    <!-- Large Toroidal Copper Inductor Coil -->
    <circle cx="90" cy="110" r="45" fill="#d97706" stroke="#b45309" stroke-width="4"/>
    <circle cx="90" cy="110" r="22" fill="#0284c7"/>
    <!-- Wire wraps -->
    <line x1="60" y1="90" x2="120" y2="130" stroke="#f59e0b" stroke-width="3"/>
    <line x1="60" y1="130" x2="120" y2="90" stroke="#f59e0b" stroke-width="3"/>

    <!-- Electrolytic Capacitors (Input & Output) -->
    <circle cx="35" cy="50" r="18" fill="#1e293b" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="35" cy="180" r="18" fill="#1e293b" stroke="#cbd5e1" stroke-width="3"/>

    <!-- Blue Multi-Turn Potentiometer -->
    <rect x="180" y="40" width="80" height="50" rx="4" fill="#1e3a8a"/>
    <circle cx="245" cy="65" r="10" fill="#f59e0b"/>

    <!-- LM2596 IC Chip with Heatsink Tab -->
    <rect x="180" y="120" width="80" height="70" rx="4" fill="#0f172a"/>
    <text x="220" y="160" font-family="monospace" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">LM2596</text>

    <!-- IN/OUT Terminals -->
    <text x="15" y="220" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">IN+</text>
    <text x="270" y="220" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">OUT+</text>
  </g>
</svg>
