<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <rect width="500" height="350" rx="16" fill="#f8fafc"/>
  <rect x="20" y="20" width="460" height="310" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <g transform="translate(100, 45)">
    <!-- Acrylic Double Layer Platform Base -->
    <rect x="50" y="20" width="200" height="210" rx="16" fill="#0284c7" fill-opacity="0.2" stroke="#0369a1" stroke-width="3"/>

    <!-- Front Left Wheel -->
    <rect x="10" y="0" width="45" height="85" rx="8" fill="#0f172a"/>
    <rect x="22" y="15" width="20" height="55" rx="4" fill="#eab308"/>

    <!-- Front Right Wheel -->
    <rect x="245" y="0" width="45" height="85" rx="8" fill="#0f172a"/>
    <rect x="257" y="15" width="20" height="55" rx="4" fill="#eab308"/>

    <!-- Rear Left Wheel -->
    <rect x="10" y="165" width="45" height="85" rx="8" fill="#0f172a"/>
    <rect x="22" y="180" width="20" height="55" rx="4" fill="#eab308"/>

    <!-- Rear Right Wheel -->
    <rect x="245" y="165" width="45" height="85" rx="8" fill="#0f172a"/>
    <rect x="257" y="180" width="20" height="55" rx="4" fill="#eab308"/>

    <!-- Center Control / Power Module -->
    <rect x="85" y="70" width="130" height="110" rx="6" fill="#1e293b"/>
    <text x="150" y="130" font-family="sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">4WD ROBOT</text>
  </g>
</svg>
