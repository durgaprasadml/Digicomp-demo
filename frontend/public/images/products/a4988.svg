<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <rect width="500" height="350" rx="16" fill="#f8fafc"/>
  <rect x="20" y="20" width="460" height="310" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <g transform="translate(140, 50)">
    <!-- Small Carrier Board (Green PCB) -->
    <rect x="0" y="0" width="220" height="240" rx="8" fill="#16a34a" stroke="#15803d" stroke-width="2"/>

    <!-- Small Metallic Heatsink Block in Center -->
    <rect x="60" y="70" width="100" height="90" rx="4" fill="#94a3b8" stroke="#64748b" stroke-width="2"/>
    <!-- Fins -->
    <line x1="80" y1="70" x2="80" y2="160" stroke="#475569" stroke-width="4"/>
    <line x1="110" y1="70" x2="110" y2="160" stroke="#475569" stroke-width="4"/>
    <line x1="140" y1="70" x2="140" y2="160" stroke="#475569" stroke-width="4"/>

    <!-- Trimmer Potentiometer (brass/silver) -->
    <circle cx="110" cy="35" r="14" fill="#f59e0b" stroke="#78350f" stroke-width="2"/>
    <line x1="102" y1="35" x2="118" y2="35" stroke="#78350f" stroke-width="2"/>

    <!-- Left Header Pins (8 Pins) -->
    <g fill="#0f172a">
      <rect x="8" y="20" width="14" height="200" rx="2"/>
      <g fill="#f59e0b">
        <circle cx="15" cy="32" r="4"/><circle cx="15" cy="57" r="4"/><circle cx="15" cy="82" r="4"/>
        <circle cx="15" cy="107" r="4"/><circle cx="15" cy="132" r="4"/><circle cx="15" cy="157" r="4"/>
        <circle cx="15" cy="182" r="4"/><circle cx="15" cy="207" r="4"/>
      </g>
    </g>

    <!-- Right Header Pins (8 Pins) -->
    <g fill="#0f172a">
      <rect x="198" y="20" width="14" height="200" rx="2"/>
      <g fill="#f59e0b">
        <circle cx="205" cy="32" r="4"/><circle cx="205" cy="57" r="4"/><circle cx="205" cy="82" r="4"/>
        <circle cx="205" cy="107" r="4"/><circle cx="205" cy="132" r="4"/><circle cx="205" cy="157" r="4"/>
        <circle cx="205" cy="182" r="4"/><circle cx="205" cy="207" r="4"/>
      </g>
    </g>

    <text x="110" y="195" font-family="monospace" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">A4988 STEPPER</text>
  </g>
</svg>
