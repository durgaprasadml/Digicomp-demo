<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <rect width="500" height="350" rx="16" fill="#f8fafc"/>
  <rect x="20" y="20" width="460" height="310" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <g transform="translate(70, 70)">
    <!-- Sensor PCB Base -->
    <rect x="0" y="30" width="360" height="150" rx="8" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>

    <!-- Left Transducer (T) -->
    <g transform="translate(75, 105)">
      <circle cx="0" cy="0" r="55" fill="#cbd5e1" stroke="#475569" stroke-width="3"/>
      <circle cx="0" cy="0" r="45" fill="#e2e8f0"/>
      <circle cx="0" cy="0" r="35" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="0" y="5" font-family="sans-serif" font-weight="bold" font-size="18" fill="#334155" text-anchor="middle">T</text>
    </g>

    <!-- Right Transducer (R) -->
    <g transform="translate(285, 105)">
      <circle cx="0" cy="0" r="55" fill="#cbd5e1" stroke="#475569" stroke-width="3"/>
      <circle cx="0" cy="0" r="45" fill="#e2e8f0"/>
      <circle cx="0" cy="0" r="35" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="0" y="5" font-family="sans-serif" font-weight="bold" font-size="18" fill="#334155" text-anchor="middle">R</text>
    </g>

    <!-- Crystal Oscillator & Electronics -->
    <ellipse cx="180" cy="65" rx="6" ry="12" fill="#cbd5e1" stroke="#64748b"/>
    <rect x="160" y="95" width="40" height="25" fill="#1e293b" rx="2"/>

    <!-- 4-Pin Header Bottom -->
    <g transform="translate(140, 180)" fill="#f59e0b">
      <rect x="0" y="0" width="80" height="15" fill="#0f172a" rx="2"/>
      <circle cx="13" cy="7.5" r="4"/><circle cx="31" cy="7.5" r="4"/>
      <circle cx="49" cy="7.5" r="4"/><circle cx="67" cy="7.5" r="4"/>
      <!-- Pin Leads -->
      <rect x="11" y="15" width="4" height="20" fill="#f59e0b"/>
      <rect x="29" y="15" width="4" height="20" fill="#f59e0b"/>
      <rect x="47" y="15" width="4" height="20" fill="#f59e0b"/>
      <rect x="65" y="15" width="4" height="20" fill="#f59e0b"/>
    </g>

    <text x="180" y="145" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">HC-SR04</text>
  </g>
</svg>
