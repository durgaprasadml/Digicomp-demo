<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="pcb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="500" height="350" rx="16" fill="#f8fafc"/>
  <rect x="20" y="20" width="460" height="310" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- ESP32 Board Base -->
  <g transform="translate(140, 45)">
    <rect x="0" y="0" width="220" height="260" rx="10" fill="url(#pcb)" stroke="#334155" stroke-width="2"/>
    
    <!-- PCB Antenna trace (gold/copper) -->
    <path d="M 60 10 H 160 V 30 H 70 V 20 H 150 V 35" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Metal Shielding Can -->
    <rect x="40" y="55" width="140" height="110" rx="6" fill="url(#shield)" stroke="#475569" stroke-width="1.5"/>
    <text x="110" y="105" font-family="monospace" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">ESP-WROOM-32</text>
    <text x="110" y="125" font-family="sans-serif" font-size="10" fill="#334155" text-anchor="middle">Wi-Fi + BT MCU</text>

    <!-- Micro-USB Connector -->
    <rect x="80" y="235" width="60" height="25" rx="4" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
    <rect x="90" y="245" width="40" height="15" rx="2" fill="#475569"/>

    <!-- Left Pin Header Row -->
    <g fill="#f59e0b">
      <rect x="8" y="40" width="14" height="180" rx="2" fill="#0f172a"/>
      <circle cx="15" cy="50" r="4"/><circle cx="15" cy="65" r="4"/><circle cx="15" cy="80" r="4"/>
      <circle cx="15" cy="95" r="4"/><circle cx="15" cy="110" r="4"/><circle cx="15" cy="125" r="4"/>
      <circle cx="15" cy="140" r="4"/><circle cx="15" cy="155" r="4"/><circle cx="15" cy="170" r="4"/>
      <circle cx="15" cy="185" r="4"/><circle cx="15" cy="200" r="4"/>
    </g>

    <!-- Right Pin Header Row -->
    <g fill="#f59e0b">
      <rect x="198" y="40" width="14" height="180" rx="2" fill="#0f172a"/>
      <circle cx="205" cy="50" r="4"/><circle cx="205" cy="65" r="4"/><circle cx="205" cy="80" r="4"/>
      <circle cx="205" cy="95" r="4"/><circle cx="205" cy="110" r="4"/><circle cx="205" cy="125" r="4"/>
      <circle cx="205" cy="140" r="4"/><circle cx="205" cy="155" r="4"/><circle cx="205" cy="170" r="4"/>
      <circle cx="205" cy="185" r="4"/><circle cx="205" cy="200" r="4"/>
    </g>

    <!-- EN & BOOT Buttons -->
    <rect x="25" y="220" width="20" height="20" rx="3" fill="#cbd5e1"/>
    <circle cx="35" cy="230" r="5" fill="#ef4444"/>
    <rect x="175" y="220" width="20" height="20" rx="3" fill="#cbd5e1"/>
    <circle cx="185" cy="230" r="5" fill="#3b82f6"/>
  </g>
</svg>
