<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="unoPcb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00878f"/>
      <stop offset="100%" stop-color="#005d63"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" rx="16" fill="#f8fafc"/>
  <rect x="20" y="20" width="460" height="310" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <g transform="translate(100, 50)">
    <!-- Board Outline -->
    <path d="M 10 10 H 280 V 230 H 40 L 10 200 Z" fill="url(#unoPcb)" stroke="#004d52" stroke-width="2"/>
    
    <!-- USB Type-B Connector -->
    <rect x="-10" y="25" width="45" height="45" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
    <rect x="-5" y="35" width="25" height="25" fill="#475569"/>

    <!-- Power Jack -->
    <rect x="-10" y="160" width="55" height="45" rx="4" fill="#1e293b"/>
    <circle cx="15" cy="182" r="8" fill="#475569"/>

    <!-- ATmega328P DIP IC -->
    <rect x="110" y="145" width="130" height="35" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="175" y="167" font-family="monospace" font-size="11" fill="#e2e8f0" text-anchor="middle">ATmega328P</text>
    
    <!-- Header Socket Strip Top (Digital) -->
    <rect x="70" y="15" width="190" height="14" fill="#1e293b"/>
    <g fill="#000000">
      <circle cx="85" cy="22" r="3" fill="#64748b"/>
      <circle cx="105" cy="22" r="3" fill="#64748b"/>
      <circle cx="125" cy="22" r="3" fill="#64748b"/>
      <circle cx="145" cy="22" r="3" fill="#64748b"/>
      <circle cx="165" cy="22" r="3" fill="#64748b"/>
      <circle cx="185" cy="22" r="3" fill="#64748b"/>
      <circle cx="205" cy="22" r="3" fill="#64748b"/>
      <circle cx="225" cy="22" r="3" fill="#64748b"/>
      <circle cx="245" cy="22" r="3" fill="#64748b"/>
    </g>

    <!-- Header Socket Strip Bottom (Analog/Power) -->
    <rect x="70" y="210" width="170" height="14" fill="#1e293b"/>
    
    <!-- Crystal Oscillator -->
    <ellipse cx="75" cy="100" rx="8" ry="16" fill="#cbd5e1" stroke="#64748b"/>

    <!-- Reset Button -->
    <rect x="235" y="45" width="22" height="22" fill="#cbd5e1" rx="2"/>
    <circle cx="246" cy="56" r="6" fill="#dc2626"/>

    <!-- Official Teal Logo Loop -->
    <circle cx="175" cy="85" r="14" fill="none" stroke="#ffffff" stroke-width="3"/>
    <text x="175" y="90" font-family="sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">∞</text>
  </g>
</svg>
