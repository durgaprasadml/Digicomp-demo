<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <rect width="500" height="350" rx="16" fill="#f8fafc"/>
  <rect x="20" y="20" width="460" height="310" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <g transform="translate(100, 45)">
    <!-- Acrylic Platform Base (amber semi-transparent) -->
    <path d="M 60 10 H 240 C 270 10, 290 40, 290 125 C 290 210, 270 240, 240 240 H 60 C 30 240, 10 210, 10 125 C 10 40, 30 10, 60 10 Z" fill="#f59e0b" fill-opacity="0.25" stroke="#d97706" stroke-width="3"/>

    <!-- Left Rubber Wheel -->
    <rect x="20" y="-10" width="40" height="90" rx="10" fill="#0f172a"/>
    <rect x="30" y="5" width="20" height="60" rx="6" fill="#eab308"/>

    <!-- Right Rubber Wheel -->
    <rect x="240" y="-10" width="40" height="90" rx="10" fill="#0f172a"/>
    <rect x="250" y="5" width="20" height="60" rx="6" fill="#eab308"/>

    <!-- Front Swivel Caster Ball -->
    <circle cx="150" cy="200" r="24" fill="#cbd5e1" stroke="#475569" stroke-width="3"/>
    <circle cx="150" cy="200" r="12" fill="#e2e8f0"/>

    <!-- Battery Box in center -->
    <rect x="100" y="75" width="100" height="60" rx="4" fill="#1e293b"/>
    <text x="150" y="110" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">2WD ROBOT</text>
  </g>
</svg>
