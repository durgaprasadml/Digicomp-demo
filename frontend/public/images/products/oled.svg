<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <rect width="500" height="350" rx="16" fill="#f8fafc"/>
  <rect x="20" y="20" width="460" height="310" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <g transform="translate(100, 45)">
    <!-- PCB Carrier Base (Dark Navy) -->
    <rect x="0" y="0" width="300" height="250" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

    <!-- 4 Mounting Holes at Corners -->
    <circle cx="15" cy="15" r="6" fill="#f8fafc"/>
    <circle cx="285" cy="15" r="6" fill="#f8fafc"/>
    <circle cx="15" cy="235" r="6" fill="#f8fafc"/>
    <circle cx="285" cy="235" r="6" fill="#f8fafc"/>

    <!-- 4-Pin Header Top -->
    <g transform="translate(100, 10)" fill="#f59e0b">
      <rect x="0" y="0" width="100" height="15" fill="#334155" rx="2"/>
      <circle cx="15" cy="7.5" r="4"/><circle cx="40" cy="7.5" r="4"/>
      <circle cx="65" cy="7.5" r="4"/><circle cx="90" cy="7.5" r="4"/>
    </g>

    <!-- OLED Glass Screen Outer Frame -->
    <rect x="35" y="45" width="230" height="170" rx="6" fill="#0284c7" opacity="0.3"/>
    <rect x="40" y="50" width="220" height="160" rx="4" fill="#000000" stroke="#334155" stroke-width="2"/>

    <!-- Active Display Area (Glowing Cyan Graphics & Telemetry) -->
    <rect x="50" y="60" width="200" height="35" fill="#38bdf8" opacity="0.9"/>
    <text x="150" y="83" font-family="monospace" font-weight="bold" font-size="16" fill="#0f172a" text-anchor="middle">DIGICOMP 0.96"</text>

    <!-- Cyan Wave / Graph Lines on OLED Screen -->
    <path d="M 55 160 Q 80 110, 105 160 T 155 160 T 205 160 T 245 160" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <text x="60" y="125" font-family="monospace" font-size="12" fill="#38bdf8">TEMP: 24.5 C</text>
    <text x="60" y="142" font-family="monospace" font-size="12" fill="#38bdf8">HUM : 58.0 %</text>
  </g>
</svg>
