<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <rect width="500" height="350" rx="16" fill="#f8fafc"/>
  <rect x="20" y="20" width="460" height="310" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <g transform="translate(100, 50)">
    <!-- Base PCB (Dark Blue) -->
    <rect x="0" y="0" width="300" height="230" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

    <!-- Blue Cubic Songle Relay Component -->
    <rect x="30" y="30" width="140" height="170" rx="6" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
    <text x="100" y="105" font-family="sans-serif" font-weight="bold" font-size="16" fill="#ffffff" text-anchor="middle">5V RELAY</text>
    <text x="100" y="130" font-family="sans-serif" font-size="11" fill="#93c5fd" text-anchor="middle">10A 250VAC</text>

    <!-- Green 3-Position Screw Terminal Output (Right) -->
    <rect x="230" y="45" width="50" height="140" rx="4" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
    <circle cx="255" cy="75" r="8" fill="#cbd5e1"/>
    <circle cx="255" cy="115" r="8" fill="#cbd5e1"/>
    <circle cx="255" cy="155" r="8" fill="#cbd5e1"/>

    <!-- Status Red Indicator LED -->
    <circle cx="190" cy="50" r="7" fill="#ef4444"/>

    <!-- Input Signal Pins Left Bottom -->
    <g transform="translate(180, 160)" fill="#f59e0b">
      <rect x="0" y="0" width="40" height="12" fill="#334155"/>
      <circle cx="8" cy="6" r="3"/><circle cx="20" cy="6" r="3"/><circle cx="32" cy="6" r="3"/>
    </g>
  </g>
</svg>
