<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <rect width="500" height="350" rx="16" fill="#f8fafc"/>
  <rect x="20" y="20" width="460" height="310" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <g transform="translate(150, 40)">
    <!-- White Plastic Housing Box -->
    <rect x="0" y="0" width="200" height="220" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    
    <!-- Perforated Mesh Holes Grid (Vertical Slits) -->
    <g fill="#94a3b8">
      <rect x="30" y="30" width="12" height="120" rx="4"/>
      <rect x="55" y="30" width="12" height="120" rx="4"/>
      <rect x="80" y="30" width="12" height="120" rx="4"/>
      <rect x="105" y="30" width="12" height="120" rx="4"/>
      <rect x="130" y="30" width="12" height="120" rx="4"/>
      <rect x="155" y="30" width="12" height="120" rx="4"/>
    </g>

    <!-- Model Label Screen Print -->
    <rect x="30" y="165" width="140" height="35" rx="4" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="100" y="187" font-family="sans-serif" font-weight="bold" font-size="14" fill="#0f172a" text-anchor="middle">DHT22 / AM2302</text>

    <!-- 4 Silver Lead Pins Extending Bottom -->
    <g fill="#cbd5e1" stroke="#64748b" stroke-width="1">
      <rect x="40" y="220" width="8" height="60" rx="2"/>
      <rect x="75" y="220" width="8" height="60" rx="2"/>
      <rect x="110" y="220" width="8" height="60" rx="2"/>
      <rect x="145" y="220" width="8" height="60" rx="2"/>
    </g>

    <!-- Small Temp/Humidity Icons overlay -->
    <circle cx="175" cy="20" r="14" fill="#ef4444"/>
    <text x="175" y="25" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">🌡️</text>
  </g>
</svg>
