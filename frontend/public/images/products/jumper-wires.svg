<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <rect width="500" height="350" rx="16" fill="#f8fafc"/>
  <rect x="20" y="20" width="460" height="310" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <g transform="translate(60, 50)">
    <!-- Arching Ribbon Wires (Rainbow colors) -->
    <path d="M 30 200 C 60 40, 320 40, 350 200" fill="none" stroke="#ef4444" stroke-width="8"/>
    <path d="M 30 210 C 60 50, 320 50, 350 210" fill="none" stroke="#f59e0b" stroke-width="8"/>
    <path d="M 30 220 C 60 60, 320 60, 350 220" fill="none" stroke="#eab308" stroke-width="8"/>
    <path d="M 30 230 C 60 70, 320 70, 350 230" fill="none" stroke="#22c55e" stroke-width="8"/>
    <path d="M 30 240 C 60 80, 320 80, 350 240" fill="none" stroke="#06b6d4" stroke-width="8"/>
    <path d="M 30 250 C 60 90, 320 90, 350 250" fill="none" stroke="#3b82f6" stroke-width="8"/>
    <path d="M 30 260 C 60 100, 320 100, 350 260" fill="none" stroke="#8b5cf6" stroke-width="8"/>

    <!-- Left Connector Housing Block (Black Plastic Header) -->
    <rect x="10" y="190" width="40" height="80" rx="4" fill="#0f172a"/>
    <g fill="#cbd5e1">
      <rect x="0" y="195" width="10" height="4" rx="1"/>
      <rect x="0" y="208" width="10" height="4" rx="1"/>
      <rect x="0" y="221" width="10" height="4" rx="1"/>
      <rect x="0" y="234" width="10" height="4" rx="1"/>
      <rect x="0" y="247" width="10" height="4" rx="1"/>
      <rect x="0" y="260" width="10" height="4" rx="1"/>
    </g>

    <!-- Right Connector Housing Block -->
    <rect x="330" y="190" width="40" height="80" rx="4" fill="#0f172a"/>
    <g fill="#cbd5e1">
      <rect x="370" y="195" width="10" height="4" rx="1"/>
      <rect x="370" y="208" width="10" height="4" rx="1"/>
      <rect x="370" y="221" width="10" height="4" rx="1"/>
      <rect x="370" y="234" width="10" height="4" rx="1"/>
      <rect x="370" y="247" width="10" height="4" rx="1"/>
      <rect x="370" y="260" width="10" height="4" rx="1"/>
    </g>

    <text x="190" y="220" font-family="sans-serif" font-weight="bold" font-size="14" fill="#0f172a" text-anchor="middle">JUMPER WIRE KIT</text>
  </g>
</svg>
